<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 208" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A blank booking sheet on a clipboard, a pencil, and a ball waiting beside it. -->
  <ellipse cx="150" cy="190" rx="118" ry="10" fill="#E9EEF6"/>

  <!-- clipboard -->
  <rect x="92" y="26" width="116" height="156" rx="12" fill="#FFFFFF" stroke="#8C9AB3" stroke-width="2"/>
  <rect x="92" y="26" width="116" height="156" rx="12" fill="#F4F7FC" opacity=".6"/>
  <rect x="120" y="16" width="60" height="22" rx="7" fill="#DCE6FB" stroke="#8C9AB3" stroke-width="2"/>
  <circle cx="150" cy="27" r="4" fill="#FFFFFF" stroke="#8C9AB3" stroke-width="1.6"/>

  <!-- the sheet: a header, a few ruled rows, all empty -->
  <rect x="106" y="50" width="88" height="120" rx="6" fill="#FFFFFF" stroke="#C3CDDC" stroke-width="1.4"/>
  <line x1="116" y1="64" x2="152" y2="64" stroke="#2563EB" stroke-width="3"/>
  <line x1="116" y1="73" x2="138" y2="73" stroke="#C3CDDC" stroke-width="2"/>
  <g stroke="#E1E7F0" stroke-width="1.4">
    <line x1="112" y1="88" x2="188" y2="88"/>
    <line x1="112" y1="104" x2="188" y2="104"/>
    <line x1="112" y1="120" x2="188" y2="120"/>
    <line x1="112" y1="136" x2="188" y2="136"/>
    <line x1="112" y1="152" x2="188" y2="152"/>
  </g>
  <g fill="#FFFFFF" stroke="#C3CDDC" stroke-width="1.4">
    <rect x="115" y="92" width="8" height="8" rx="2"/>
    <rect x="115" y="108" width="8" height="8" rx="2"/>
    <rect x="115" y="124" width="8" height="8" rx="2"/>
    <rect x="115" y="140" width="8" height="8" rx="2"/>
  </g>

  <!-- pencil -->
  <g transform="rotate(-38 222 124)">
    <rect x="186" y="118" width="62" height="12" rx="2" fill="#FFD166" stroke="#8C9AB3" stroke-width="1.8"/>
    <rect x="240" y="118" width="10" height="12" rx="2" fill="#F4A6A6" stroke="#8C9AB3" stroke-width="1.8"/>
    <path d="M186 118l-12 6 12 6z" fill="#F7E3C4" stroke="#8C9AB3" stroke-width="1.8"/>
    <path d="M178 122l-4 2 4 2z" fill="#475569"/>
  </g>

  <!-- ball -->
  <circle cx="62" cy="164" r="18" fill="#FFFFFF" stroke="#8C9AB3" stroke-width="2"/>
  <path d="M62 155l7.6 5.5-2.9 8.9h-9.4l-2.9-8.9z" fill="#334155"/>
  <path d="M62 146v9M69.6 160.5l8.2-3.1M66.7 169.4l5.3 7.4M57.3 169.4l-5.3 7.4M54.4 160.5l-8.2-3.1" stroke="#8C9AB3" stroke-width="1.4"/>

</svg>
