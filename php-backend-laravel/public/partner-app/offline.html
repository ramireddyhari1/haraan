<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Haraan Partner</title>
<style>
    html, body { margin: 0; height: 100%; background: #fff; color: #0f172a; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 1px 0 rgba(15, 23, 42, .06), 0 6px 18px rgba(15, 23, 42, .08); }
    h1 { font-size: 19px; margin: 20px 0 6px; letter-spacing: -.01em; }
    p { margin: 0 0 22px; color: #64748b; max-width: 300px; }
    button { appearance: none; border: 0; border-radius: 12px; background: #2563eb; color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; padding: 13px 22px; cursor: pointer; }
</style>
</head>
<body>
<main>
    <img src="/partner-app/icon-192.png" alt="">
    <h1>You’re offline</h1>
    <p>Bookings and the desk need a connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
